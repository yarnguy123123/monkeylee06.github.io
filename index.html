<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yarn Arcade</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topbar">
    <div class="yarn-icon"></div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Games</a>
      <a href="#" class="discord-btn">Discord</a>
    </div>
  </div>

  <div class="hero">
    <h1>Yarn Arcade</h1>
    <p>Choose a game and start playing!</p>
  </div>

  <div class="game-grid">
        <div class="game-card">
      <h3>Flappy Yarn</h3>
      <button class="play-btn" data-launch="flappyYarn">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Platformer</h3>
      <button class="play-btn" data-launch="yarnPlatformer">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Maze</h3>
      <button class="play-btn" data-launch="yarnMaze">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Runner</h3>
      <button class="play-btn" data-launch="yarnRunner">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Drift</h3>
      <button class="play-btn" data-launch="yarnDrift">Play</button>
    </div>
        <div class="game-card">
      <h3>Yarn Breakout</h3>
      <button class="play-btn" data-launch="yarnBreakout">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Dodge</h3>
      <button class="play-btn" data-launch="yarnDodge">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Clicker</h3>
      <button class="play-btn" data-launch="yarnClicker">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Jump</h3>
      <button class="play-btn" data-launch="yarnJump">Play</button>
    </div>

    <div class="game-card">
      <h3>Yarn Shooter</h3>
      <button class="play-btn" data-launch="yarnShooter">Play</button>
    </div>

  </div>
    <div id="gameModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Game</h2>
        <button id="closeModal" class="close-btn">×</button>
      </div>
      <div class="modal-body">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="js/launcher.js"></script>
</body>
</html>
