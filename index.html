<!DOCTYPE html>
<html>
<head>
    <title>YARN</title>
    <style>
        /* 🌈 Full‑page rainbow outline */
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            border-radius: 14px;
            border: 4px solid transparent;
            background-clip: padding-box;
            animation: rainbowOutline 6s linear infinite;
        }

        @keyframes rainbowOutline {
            0%   { box-shadow: 0 0 12px 3px #ff00ff; }
            20%  { box-shadow: 0 0 12px 3px #ff0066; }
            40%  { box-shadow: 0 0 12px 3px #00ffff; }
            60%  { box-shadow: 0 0 12px 3px #00ff00; }
            80%  { box-shadow: 0 0 12px 3px #ff9900; }
            100% { box-shadow: 0 0 12px 3px #ff00ff; }
        }

        h1 {
            margin-top: 40px;
            font-size: 60px;
        }

        /* 💜 Buttons */
        .button {
            background-color: #7a00ff;
            color: white;
            padding: 15px 30px;
            margin: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .button:hover {
            background-color: #9b33ff;
        }

        .spark {
            position: absolute;
            width: 120%;
            height: 120%;
            background: rgba(255,255,255,0.6);
            top: -10%;
            left: -120%;
            transform: skewX(-20deg);
            filter: blur(10px);
            transition: 0.4s;
        }

        .button:active .spark {
            left: 120%;
        }

        footer {
            margin-top: 50px;
            color: #888;
        }

        /* 🧶 Bouncing Yarn Emoji */
        .bouncy-yarn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            animation: bounce 1.2s infinite ease-in-out;
            user-select: none;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes bounce {
            0%   { transform: translateX(-50%) translateY(0); }
            50%  { transform: translateX(-50%) translateY(-25px); }
            100% { transform: translateX(-50%) translateY(0); }
        }

        /* ⭐ Minigame Button */
        #miniGameBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #00ccff;
            color: black;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 0 10px #00ccff;
        }

        /* ⭐ Fullscreen Minigame Menu */
        #gameMode {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, purple);
            background-size: 400% 400%;
            animation: rainbowMove 6s linear infinite;
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Minigame Menu Box */
        #menuBox {
            background: rgba(0,0,0,0.6);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px white;
            text-align: center;
        }

        .menuTitle {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .minigameBtn {
            background: #7a00ff;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .minigameBtn:hover {
            background: #9b33ff;
        }

        /* 🎮 Yarn Clicker Page */
        #yarnClickerPage {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            color: white;
            text-align: center;
            padding-top: 40px;
            z-index: 99999;
        }

        #clickCounter {
            font-size: 40px;
            margin-bottom: 20px;
        }

        #bigYarn {
            font-size: 150px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        #bigYarn:active {
            transform: scale(0.9);
        }

        #upgradeShop {
            margin-top: 40px;
        }

        #upgradeShop button {
            display: block;
            margin: 10px auto;
            padding: 12px 20px;
            background: #7a00ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        #upgradeShop button:hover {
            background: #9b33ff;
        }
    </style>
</head>

<body>

    <!-- Minigame Button -->
    <button id="miniGameBtn">PLAY MINIGAMES</button>

    <!-- Minigame Menu -->
    <div id="gameMode">
        <div id="menuBox">
            <div class="menuTitle">🎮 Choose a Minigame</div>

            <button class="minigameBtn" onclick="openYarnClicker()">
                🧶 Yarn Clicker
            </button>

            <p style="margin-top:20px; color:#ccc;">Press ESC to exit</p>
        </div>
    </div>

    <!-- Yarn Clicker Game -->
    <div id="yarnClickerPage">
        <div id="clickCounter">Clicks: 0</div>

        <div id="bigYarn">🧶</div>

        <div id="upgradeShop">
            <h2>Upgrades</h2>
            <button onclick="buyUpgrade(0)">+1 per click (Cost: 20)</button>
            <button onclick="buyUpgrade(1)">+5 per click (Cost: 100)</button>
            <button onclick="buyUpgrade(2)">Auto‑Clicker (Cost: 250)</button>
            <button onclick="buyUpgrade(3)">Double Clicks (Cost: 500)</button>
            <button onclick="buyUpgrade(4)">Mega Yarn (Cost: 2000)</button>
        </div>
    </div>

    <h1>🧶 YARN 🧶</h1>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/users/897945411/profile')">
        My Profile
        <div class="spark"></div>
    </button>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/games/76938252895073/THE-ANOMALY-NIGHT')">
        Anomaly Night
        <div class="spark"></div>
    </button>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/games/85488226664354/THE-SPEEDING-BRAINROT-WALL')">
        Speeding Brainrot Wall
        <div class="spark"></div>
    </button>

    <p>More coming soon</p>

    <footer>© Yarn — All rights reserved.</footer>

    <div class="bouncy-yarn" id="yarnEmoji">🧶</div>

    <button id="monsterBlastBtn" style="display:none;" onclick="window.location.href='https://www.roblox.com/games/7313347582/MONSTER-BLAST'">
        MONSTER BLAST
    </button>

    <script>
        function shineAndGo(url) {
            setTimeout(() => window.location.href = url, 300);
        }

        /* Fireworks */
        function spawnFireworks() {
            const colors = ["#ff0000", "#00ffea", "#ff00ff", "#ffff00", "#00ff00", "#ff8800"];

            for (let i = 0; i < 12; i++) {
                let fw = document.createElement("div");
                fw.className = "firework";
                fw.style.background = colors[Math.floor(Math.random() * colors.length)];

                let x = (window.innerWidth / 2) + (Math.random() * 120 - 60);
                let y = window.innerHeight - 120 + (Math.random() * 40 - 20);

                fw.style.left = x + "px";
                fw.style.top = y + "px";

                document.body.appendChild(fw);
                setTimeout(() => fw.remove(), 700);
            }
        }

        /* Yarn → Monster Blast */
        document.getElementById("yarnEmoji").onclick = () => {
            yarnEmoji.style.display = "none";
            monsterBlastBtn.style.display = "block";
            spawnFireworks();
        };

        /* ⭐ Minigame Menu Logic */
        const gameMode = document.getElementById("gameMode");
        const miniBtn = document.getElementById("miniGameBtn");

        miniBtn.onclick = () => {
            gameMode.style.display = "flex";
        };

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                gameMode.style.display = "none";
                document.getElementById("yarnClickerPage").style.display = "none";
            }
        });

        /* 🎮 Yarn Clicker Logic */
        function openYarnClicker() {
            gameMode.style.display = "none";
            document.getElementById("yarnClickerPage").style.display = "block";
        }

        let clicks = 0;
        let clickPower = 1;
        let autoClick = false;

        const upgradeCosts = [20, 100, 250, 500, 2000];

        document.getElementById("bigYarn").onclick = () => {
            clicks += clickPower;
            updateCounter();
        };

        function updateCounter() {
            document.getElementById("clickCounter").innerText = "Clicks: " + clicks;
        }

        function buyUpgrade(id) {
            if (clicks < upgradeCosts[id]) return;

            clicks -= upgradeCosts[id];

            if (id === 0) clickPower += 1;
            if (id === 1) clickPower += 5;
            if (id === 2 && !autoClick) {
                autoClick = true;
                setInterval(() => {
                    clicks += 1;
                    updateCounter();
                }, 1000);
            }
            if (id === 3) clickPower *= 2;
            if (id === 4) clickPower += 50;

            updateCounter();
        }
    </script>

</body>
</html>
