<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Yarn • Gaming Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b14;
    color: white;
  }

  /* Top bar */
  header {
    background: #11111d;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #2a2a40;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .yarn-icon {
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #ff7acb, #b3005f);
    border-radius: 50%;
    position: relative;
  }

  .yarn-icon::after {
    content: "👑";
    position: absolute;
    top: -12px;
    right: -10px;
    font-size: 20px;
  }

  nav a {
    margin-left: 20px;
    color: #ccc;
    text-decoration: none;
    font-size: 15px;
  }

  nav a:hover {
    color: white;
  }

  .discord {
    background: #ff7acb;
    padding: 8px 14px;
    border-radius: 20px;
    color: black;
    font-weight: bold;
    text-decoration: none;
  }

  /* Game grid */
  .games {
    padding: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
  }

  .game-card {
    background: #161622;
    border: 1px solid #2a2a40;
    border-radius: 12px;
    padding: 15px;
  }

  .game-card h3 {
    margin-top: 0;
  }

  iframe {
    width: 100%;
    height: 420px;
    border: none;
    border-radius: 10px;
  }
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="yarn-icon"></div>
    <h2>Brand Yarn</h2>
  </div>

  <nav>
    <a href="#games">Games</a>
    <a class="discord" href="https://discord.gg/WcTZxEbeEB" target="_blank">🧶 Discord</a>
  </nav>
</header>

<section id="games" class="games">

  <!-- Game 1: 2048 -->
  <div class="game-card">
    <h3>2048</h3>
    <iframe src="https://play2048.co/"></iframe>
  </div>

  <!-- Game 2: Tetris -->
  <div class="game-card">
    <h3>Tetris</h3>
    <iframe src="https://tetris.com/play-tetris"></iframe>
  </div>

  <!-- Game 3: Flappy Bird -->
  <div class="game-card">
    <h3>Flappy Bird</h3>
    <iframe src="https://flappybird.io/"></iframe>
  </div>

  <!-- Game 4: Snake -->
  <div class="game-card">
    <h3>Snake</h3>
    <iframe src="https://playsnake.org/"></iframe>
  </div>

  <!-- Game 5: Dino Game -->
  <div class="game-card">
    <h3>Dino Run</h3>
    <iframe src="https://chromedino.com/"></iframe>
  </div>

</section>

</body>
</html>
