<!DOCTYPE html>
<html>
<head>
    <title>YARN</title>
    <style>
        /* 🌈 Full‑page rainbow outline */
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            border-radius: 14px;
            border: 4px solid transparent;
            background-clip: padding-box;
            animation: rainbowOutline 6s linear infinite;
        }

        @keyframes rainbowOutline {
            0%   { box-shadow: 0 0 12px 3px #ff00ff; }
            20%  { box-shadow: 0 0 12px 3px #ff0066; }
            40%  { box-shadow: 0 0 12px 3px #00ffff; }
            60%  { box-shadow: 0 0 12px 3px #00ff00; }
            80%  { box-shadow: 0 0 12px 3px #ff9900; }
            100% { box-shadow: 0 0 12px 3px #ff00ff; }
        }

        h1 {
            margin-top: 40px;
            font-size: 60px;
        }

        /* 💜 Buttons */
        .button {
            background-color: #7a00ff;
            color: white;
            padding: 15px 30px;
            margin: 15px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .button:hover {
            background-color: #9b33ff;
        }

        .spark {
            position: absolute;
            width: 120%;
            height: 120%;
            background: rgba(255,255,255,0.6);
            top: -10%;
            left: -120%;
            transform: skewX(-20deg);
            filter: blur(10px);
            transition: 0.4s;
        }

        .button:active .spark {
            left: 120%;
        }

        footer {
            margin-top: 50px;
            color: #888;
        }

        /* ⭐ Minigame Button */
        #miniGameBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: #00ccff;
            color: black;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 0 10px #00ccff;
        }

        /* ⭐ Fullscreen Minigame Menu */
        #gameMode {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, purple);
            background-size: 400% 400%;
            animation: rainbowMove 6s linear infinite;
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Minigame Menu Box */
        #menuBox {
            background: rgba(0,0,0,0.6);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 0 20px white;
            text-align: center;
        }

        .menuTitle {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .minigameBtn {
            background: #7a00ff;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .minigameBtn:hover {
            background: #9b33ff;
        }

        /* 🎮 Yarn Clicker Page */
        #yarnClickerPage {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            color: white;
            text-align: center;
            padding-top: 40px;
            z-index: 99999;
        }

        #clickCounter {
            font-size: 40px;
            margin-bottom: 20px;
        }

        #bigYarn {
            font-size: 150px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        #bigYarn:active {
            transform: scale(0.9);
        }

        #upgradeShop {
            margin-top: 40px;
        }

        #upgradeShop button {
            display: block;
            margin: 10px auto;
            padding: 12px 20px;
            background: #7a00ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        #upgradeShop button:hover {
            background: #9b33ff;
        }

        /* 🔵 Yarn AI full-screen overlay */
        #yarnAIOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 1000000;
        }

        #yarnAIChat {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #yarnAIMessages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #yarnAIInputBar {
            display: flex;
            padding: 12px;
            background: rgba(20,20,20,0.95);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #yarnAIInput {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: #111;
            color: white;
            font-size: 16px;
        }

        #yarnAISend {
            margin-left: 10px;
            padding: 0 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg,#00e0ff,#7b5cff);
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 0 14px #00e0ff;
        }

        /* Bubble-shaped Yarn AI button (bottom center) */
        #yarnAIButton {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle at 30% 30%, #7b5cff, #00e0ff);
            padding: 16px 26px;
            border-radius: 999px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px #7b5cff, 0 0 30px #00e0ff;
            z-index: 9999;
            border: 2px solid rgba(255,255,255,0.2);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        #yarnAIButton:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 0 26px #7b5cff, 0 0 40px #00e0ff;
        }

        /* Chat bubbles */
        .aiBubble, .userBubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            position: relative;
            color: white;
            background: #111;
            animation: fadeIn 0.2s ease;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* Rainbow outline */
        .aiBubble::before, .userBubble::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(#7b5cff,#00e0ff,#ff4b6a,#ffd166,#7b5cff);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* AI left, user right */
        .aiBubble { align-self: flex-start; }
        .userBubble { align-self: flex-end; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- Minigame Button -->
    <button id="miniGameBtn">PLAY MINIGAMES</button>

    <!-- Minigame Menu -->
    <div id="gameMode">
        <div id="menuBox">
            <div class="menuTitle">🎮 Choose a Minigame</div>

            <button class="minigameBtn" onclick="openYarnClicker()">
                🧶 Yarn Clicker
            </button>

            <p style="margin-top:20px; color:#ccc;">Press ESC to exit</p>
        </div>
    </div>

    <!-- Yarn Clicker Game -->
    <div id="yarnClickerPage">
        <div id="clickCounter">Clicks: 0</div>

        <div id="bigYarn">🧶</div>

        <div id="upgradeShop">
            <h2>Upgrades</h2>
            <button onclick="buyUpgrade(0)">+1 per click (Cost: 20)</button>
            <button onclick="buyUpgrade(1)">+5 per click (Cost: 100)</button>
            <button onclick="buyUpgrade(2)">Auto‑Clicker (Cost: 250)</button>
            <button onclick="buyUpgrade(3)">Double Clicks (Cost: 500)</button>
            <button onclick="buyUpgrade(4)">Mega Yarn (Cost: 2000)</button>
        </div>
    </div>

    <h1>🧶 YARN 🧶</h1>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/users/897945411/profile')">
        My Profile
        <div class="spark"></div>
    </button>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/games/76938252895073/THE-ANOMALY-NIGHT')">
        Anomaly Night
        <div class="spark"></div>
    </button>

    <button class="button" onclick="shineAndGo('https://www.roblox.com/games/85488226664354/THE-SPEEDING-BRAINROT-WALL')">
        Speeding Brainrot Wall
        <div class="spark"></div>
    </button>

    <p>More coming soon</p>

    <footer>© Yarn — All rights reserved.</footer>

    <!-- Hidden Monster Blast button still here if you ever want to use it -->
    <button id="monsterBlastBtn" style="display:none;" onclick="window.location.href='https://www.roblox.com/games/7313347582/MONSTER-BLAST'">
        MONSTER BLAST
    </button>

    <!-- 🔵 FULLSCREEN YARN AI CHAT -->
    <div id="yarnAIOverlay">
        <div id="yarnAIChat">
            <div id="yarnAIMessages"></div>

            <div id="yarnAIInputBar">
                <input id="yarnAIInput" type="text" placeholder="Talk to Yarn AI..." autocomplete="off">
                <button id="yarnAISend">➤</button>
            </div>
        </div>
    </div>

    <!-- Bubble-shaped Yarn AI button (replaces bouncing yarn) -->
    <div id="yarnAIButton">Yarn AI</div>

    <script>
        function shineAndGo(url) {
            setTimeout(() => window.location.href = url, 300);
        }

        /* ⭐ Minigame Menu Logic */
        const gameMode = document.getElementById("gameMode");
        const miniBtn = document.getElementById("miniGameBtn");

        miniBtn.onclick = () => {
            gameMode.style.display = "flex";
        };

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                gameMode.style.display = "none";
                document.getElementById("yarnClickerPage").style.display = "none";
                // Also close AI overlay on ESC
                document.getElementById("yarnAIOverlay").style.display = "none";
            }
        });

        /* 🎮 Yarn Clicker Logic */
        function openYarnClicker() {
            gameMode.style.display = "none";
            document.getElementById("yarnClickerPage").style.display = "block";
        }

        let clicks = 0;
        let clickPower = 1;
        let autoClick = false;

        const upgradeCosts = [20, 100, 250, 500, 2000];

        document.getElementById("bigYarn").onclick = () => {
            clicks += clickPower;
            updateCounter();
        };

        function updateCounter() {
            document.getElementById("clickCounter").innerText = "Clicks: " + clicks;
        }

        function buyUpgrade(id) {
            if (clicks < upgradeCosts[id]) return;

            clicks -= upgradeCosts[id];

            if (id === 0) clickPower += 1;
            if (id === 1) clickPower += 5;
            if (id === 2 && !autoClick) {
                autoClick = true;
                setInterval(() => {
                    clicks += 1;
                    updateCounter();
                }, 1000);
            }
            if (id === 3) clickPower *= 2;
            if (id === 4) clickPower += 50;

            updateCounter();
        }

        /* 🔵 Yarn AI full-screen chat logic */

        const yarnAIButton = document.getElementById("yarnAIButton");
        const yarnAIOverlay = document.getElementById("yarnAIOverlay");
        const yarnAIMessages = document.getElementById("yarnAIMessages");
        const yarnAIInput = document.getElementById("yarnAIInput");
        const yarnAISend = document.getElementById("yarnAISend");

        yarnAIButton.onclick = () => {
            yarnAIOverlay.style.display = "flex";
            yarnAIInput.focus();

            // First-time greeting
            if (!yarnAIMessages.hasChildNodes()) {
                addBubble(
                    "Hey, I’m Yarn AI. Type anything and I’ll respond. When you connect me to a real backend, I’ll get even smarter.",
                    "ai"
                );
            }
        };

        function addBubble(text, type) {
            const bubble = document.createElement("div");
            bubble.className = type === "user" ? "userBubble" : "aiBubble";
            bubble.textContent = text;
            yarnAIMessages.appendChild(bubble);
            yarnAIMessages.scrollTop = yarnAIMessages.scrollHeight;
        }

        // 🔌 Real AI hook with safe fallback
        async function callYarnAI(message) {
            // 1) Try real backend (replace URL with your Vercel/Netlify endpoint)
            const backendUrl = "https://your-backend-url-here/api/yarn-ai"; // <-- change this later

            try {
                const response = await fetch(backendUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.reply) return data.reply;
                }
                throw new Error("Bad response");
            } catch (err) {
                // 2) Fallback: smart-feeling local demo replies
                const replies = [
                    "That’s actually a really cool idea. Want to turn it into a minigame?",
                    "I can help you plan mechanics, chaos, or UI for your games.",
                    "Imagine this as a Yarn event with flashing colors and a timer.",
                    "You can ask me about your games, website ideas, or anything else.",
                    "Let’s build something cursed and fun. What’s next in your head?"
                ];
                const pick = replies[Math.floor(Math.random() * replies.length)];
                return pick + " (demo reply — connect me to a real AI backend when you’re ready.)";
            }
        }

        async function sendAIMessage() {
            const text = yarnAIInput.value.trim();
            if (!text) return;

            addBubble(text, "user");
            yarnAIInput.value = "";

            const reply = await callYarnAI(text);
            addBubble(reply, "ai");
        }

        yarnAISend.onclick = sendAIMessage;

        yarnAIInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                sendAIMessage();
            }
        });
    </script>

</body>
</html>
